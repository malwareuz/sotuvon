[package]
name = "sotuvon"
version = "1.0.0"
description = "SotuvOn POS — Point of Sale tizimi"
authors = ["SotuvOn"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "sotuvon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
